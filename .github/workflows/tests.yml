name: Wallet tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wallet_testing
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: |
          cp .env.example .env
          php artisan key:generate
          php vendor/bin/phpunit
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: wallet
          DB_PASSWORD: ci-only-password
      - name: Two-process HTTP concurrency and evidence
        run: |
          php artisan migrate:fresh --seed --force
          php -S 127.0.0.1:8087 -t public > /tmp/wallet-8087.log 2>&1 &
          php -S 127.0.0.1:8088 -t public > /tmp/wallet-8088.log 2>&1 &
          for port in 8087 8088; do
            for i in {1..30}; do curl -fsS http://127.0.0.1:$port/login >/dev/null && break; sleep 1; done
          done
          EDITION=secured
          if [ "${{ github.ref_name }}" = "vulnerable-demo" ]; then EDITION=vulnerable; fi
          python3 scripts/concurrency_check.py http://127.0.0.1:8087 --second-base http://127.0.0.1:8088 --edition "$EDITION"
          php artisan migrate:fresh --seed --force
          python3 scripts/http_evidence.py http://127.0.0.1:8087 --edition "$EDITION"
        env:
          DB_DATABASE: wallet_testing
          DB_USERNAME: wallet
          DB_PASSWORD: ci-only-password
          WEBHOOK_SECRET: ci-only-simulator-secret-with-at-least-32-characters
